<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Mind Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
/* Layout idea: a study desk. One column of index cards on a cool paper ground, highlighter-yellow for the one thing to do next, bottom tab bar like a phone app. */
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#131C33; --muted:#5B6680; --line:#D5DBE6;
  --hi:#FFC533; --hi-ink:#2A1F00; --teal:#0B7A75; --teal-soft:#DDF1EF;
  --good:#1B8A4B; --bad:#C23B32; --good-soft:#DFF3E7; --bad-soft:#F8E1DF;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Verdana",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#000000; --card:#111318; --ink:#F1F3F7; --muted:#9AA3B5; --line:#272B35;
    --hi:#FFC533; --hi-ink:#2A1F00; --teal:#4FC9C2; --teal-soft:#0F2B2E;
    --good:#5BD08C; --bad:#FF8177; --good-soft:#173A29; --bad-soft:#44201E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#000000; --card:#111318; --ink:#F1F3F7; --muted:#9AA3B5; --line:#272B35;
  --hi:#FFC533; --hi-ink:#2A1F00; --teal:#4FC9C2; --teal-soft:#0F2B2E;
  --good:#5BD08C; --bad:#FF8177; --good-soft:#173A29; --bad-soft:#44201E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100%}
header.top{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card)}
header.top h1{font-family:var(--display);font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em;flex:1;text-wrap:balance}
header.top .mark{background:var(--hi);color:var(--hi-ink);padding:0 6px;border-radius:4px}
#back{display:none}
main{flex:1;overflow-y:auto;padding:16px 16px 28px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
nav.tabs{display:flex;border-top:1px solid var(--line);background:var(--card)}
nav.tabs button{flex:1;background:none;border:0;padding:9px 2px 10px;font:inherit;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-top:3px solid transparent}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink);border-top-color:var(--hi);font-weight:700}
h2{font-family:var(--display);font-size:24px;line-height:1.15;margin:4px 0 0;font-weight:800;text-wrap:balance}
h3{font-family:var(--display);font-size:17px;margin:0;font-weight:700;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.next{border-left:6px solid var(--hi)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
button,.btn{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;min-height:44px}
.btn.primary{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--card)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;color:var(--ink);min-height:96px}
.tile:hover{border-color:var(--ink)}
.tile b{font-family:var(--display);font-size:16px}
.tile .small{color:var(--muted)}
.tile>.pill,.card>.pill{align-self:flex-start}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.hi{background:var(--hi);color:var(--hi-ink)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink);cursor:pointer;width:100%}
.item:last-child{border-bottom:0}
.item .n{font-family:var(--mono);font-size:13px;color:var(--muted);width:26px;flex:none;font-variant-numeric:tabular-nums}
.item .t{flex:1}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px}
.check.on{background:var(--good);border-color:var(--good);color:var(--card)}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--teal);border-radius:99px}
ol.steps{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px}
.lesson p{max-width:65ch}
.callout{background:var(--teal-soft);border-radius:10px;padding:12px 14px}
.callout.hi{background:var(--hi);color:var(--hi-ink)}
.stat{display:flex;flex-direction:column;gap:0}
.stat b{font-family:var(--display);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
input[type=text],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
textarea{min-height:120px;resize:vertical}
label{font-weight:700;font-size:14px;display:flex;flex-direction:column;gap:4px}
.field-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big{font-family:var(--display);font-weight:800;font-size:clamp(34px,11vw,64px);line-height:1.1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em;overflow-wrap:anywhere}
.stage{min-height:170px;display:grid;place-items:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.timer{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:15px;padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.chip.ok{background:var(--good-soft);border-color:var(--good);color:var(--ink)}
.chip.no{background:var(--bad-soft);border-color:var(--bad);color:var(--ink)}
.schulte{display:grid;gap:5px;width:min(100%,420px);margin:0 auto}
.schulte button{aspect-ratio:1;font-family:var(--display);font-weight:800;font-size:clamp(16px,5.5vw,26px);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;cursor:pointer;padding:0}
.schulte button.hit{background:var(--good-soft);color:var(--muted)}
.schulte button.miss{background:var(--bad-soft)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:320px;margin:0 auto;width:100%}
.keypad button{min-height:52px;font-family:var(--display);font-size:22px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;cursor:pointer}
.keypad button.go{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.pc{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:8px 0;text-align:center;font-family:var(--display);font-weight:800;font-size:18px;cursor:pointer;color:var(--ink)}
.pc.red{color:var(--bad)} .pc.used{opacity:.3}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.face{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.face svg{width:96px;height:96px}
.reader{font-size:19px;line-height:1.75;max-width:62ch;margin:0 auto}
.reader mark{background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 1px}
.rsvp{font-family:var(--display);font-weight:700;font-size:clamp(26px,8vw,44px);min-height:130px;display:grid;place-items:center;text-align:center}
.spark{width:100%;height:60px;display:block}
.spark path.l{fill:none;stroke:var(--teal);stroke-width:2}
.spark path.a{fill:var(--teal-soft);stroke:none}
.spark circle{fill:var(--hi);stroke:var(--ink);stroke-width:1}
.flip{min-height:150px;display:grid;place-items:center;text-align:center;font-size:19px;padding:20px}
.src{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.src:last-child{border-bottom:0}
.week{display:flex;gap:4px;flex-wrap:wrap}
.dot{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;font-family:var(--mono);color:var(--muted)}
.dot.on{background:var(--good);border-color:var(--good);color:var(--card)}
.dot.now{border:2px solid var(--hi);color:var(--ink)}
details summary{cursor:pointer;font-weight:700}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
@media (prefers-reduced-motion:no-preference){.tile,.btn{transition:border-color .12s,transform .12s}.btn:active{transform:scale(.98)}}

</style>
</head>
<body>
<div id="app">
<header class="top"><button class="btn sm ghost" id="back" aria-label="Back">← Back</button><h1 id="title">Mind <span class="mark">Mastery</span></h1></header>
<main></main>
<nav class="tabs" aria-label="Sections"></nav>
</div>
<script>
window.STANDALONE = true;
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
const rnd = n => Math.floor(Math.random() * n);
const ri = (a, b) => a + rnd(b - a + 1);
const pick = a => a[rnd(a.length)];
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const sample = (a, n) => shuffle(a).slice(0, n);
const today = (d = new Date()) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmtT = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const norm = s => String(s || '').trim().toLowerCase().replace(/[^a-z0-9à-ÿ ]/g, '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- state ---------- */
const KEY = 'mindmastery.v1';
function defState() {
  return {
    done: {}, log: [], cards: {}, palaces: [{ name: 'Example: a flat', loci: ['Front door', 'Coat hooks', 'Sofa', 'Television', 'Dining table', 'Fridge', 'Kitchen sink', 'Bathroom mirror', 'Bed', 'Desk'] }],
    pegs: {}, days: {}, prog: { on: false, start: null }, set: { code: 'major', theme: 'dark' }, notes: {}
  };
}
let S = (function () { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(defState(), JSON.parse(r)); } catch (e) { } return defState(); })();
let storageOK = true;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); storageOK = true; } catch (e) { storageOK = false; } }
function touchDay() { const d = today(); S.days[d] = (S.days[d] || 0) + 1; }
function streak() {
  let n = 0; const d = new Date();
  if (!S.days[today(d)]) d.setDate(d.getDate() - 1);
  while (S.days[today(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function logScore(id, score, extra) { S.log.push({ d: id, t: Date.now(), s: score, x: extra || '' }); if (S.log.length > 4000) S.log.splice(0, S.log.length - 4000); touchDay(); save(); }
function scoresFor(id) { return S.log.filter(l => l.d === id); }
function bestFor(id, higher = true) { const a = scoresFor(id).map(l => l.s); if (!a.length) return null; return higher ? Math.max(...a) : Math.min(...a); }
function applyTheme() { document.documentElement.setAttribute('data-theme', S.set.theme === 'light' ? 'light' : 'dark'); }

/* ---------- navigation ---------- */
const TABS = [
  ['today', 'Today', '<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6h-6v6H5a1 1 0 0 1-1-1z"/>'],
  ['learn', 'Learn', '<path d="M4 5h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v13h-6a3 3 0 0 0-2 1 3 3 0 0 0-2-1H4z"/><path d="M12 6v13"/>'],
  ['train', 'Train', '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'],
  ['review', 'Review', '<rect x="4" y="6" width="13" height="13" rx="2"/><path d="M8 3h11a1 1 0 0 1 1 1v11"/>'],
  ['more', 'More', '<path d="M4 19V10M10 19V5M16 19v-7M21 19H3"/>']
];
let stack = [], cleanups = [], curTab = 'today';
function onLeave(fn) { cleanups.push(fn); }
function runCleanups() { cleanups.forEach(f => { try { f(); } catch (e) { } }); cleanups = []; }
function render() {
  runCleanups();
  const top = stack[stack.length - 1];
  $('#title').innerHTML = stack.length > 1 ? esc(top.title) : 'Mind <span class="mark">Mastery</span>';
  $('#back').style.display = stack.length > 1 ? 'inline-flex' : 'none';
  const main = $('main'); main.innerHTML = ''; const w = el('div', { class: 'wrap' }); main.append(w); top.fn(w); main.scrollTop = 0;
  document.querySelectorAll('nav.tabs button').forEach(b => b.dataset.tab === curTab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
}
function go(fn, title) { stack.push({ fn, title }); render(); }
function back() { if (stack.length > 1) { stack.pop(); render(); } }
function tab(id, silent) { curTab = id; stack = [{ fn: VIEWS[id], title: '' }]; if (!silent) { try { if (location.hash !== '#' + id) location.hash = id; } catch (e) { } } render(); }
function timerEvery(ms, fn) { const i = setInterval(fn, ms); onLeave(() => clearInterval(i)); return () => clearInterval(i); }
function after(ms, fn) { const i = setTimeout(fn, ms); onLeave(() => clearTimeout(i)); return () => clearTimeout(i); }

/* ---------- small UI pieces ---------- */
function progressBar(frac) { return el('div', { class: 'bar' }, el('i', { style: 'width:' + Math.round(100 * Math.min(1, frac)) + '%' })); }
function spark(vals) {
  if (vals.length < 2) return null;
  const W = 300, H = 60, mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx - mn) || 1;
  const pts = vals.map((v, i) => [4 + i * (W - 8) / (vals.length - 1), H - 6 - (v - mn) / sp * (H - 14)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  const s = el('div', { html: `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Score trend"><path class="a" d="${d} L${last[0]} ${H} L4 ${H} Z"/><path class="l" d="${d}"/><circle cx="${last[0]}" cy="${last[1]}" r="3.5"/></svg>` });
  return s.firstChild;
}
function select(id, label, opts, val, onchange) {
  const s = el('select', { id, onchange: e => onchange && onchange(e.target.value) }, opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; const op = el('option', { value: v }, t); if (String(v) === String(val)) op.selected = true; return op; }));
  return el('label', { for: id }, label, s);
}
function resultCard(drill, id, score, unitText, lines, again) {
  const prevBest = (function () { const a = scoresFor(id).slice(0, -1).map(l => l.s); return a.length ? (drill.higher === false ? Math.min(...a) : Math.max(...a)) : null; })();
  const isBest = prevBest == null || (drill.higher === false ? score < prevBest : score > prevBest);
  return el('div', { class: 'card next' },
    el('div', { class: 'row between' }, el('h3', null, 'Result'), isBest && scoresFor(id).length > 1 ? el('span', { class: 'pill hi' }, 'New personal best') : null),
    el('div', { class: 'stat' }, el('b', null, unitText), prevBest != null ? el('span', { class: 'muted small' }, 'Previous best: ' + drill.fmt(prevBest)) : el('span', { class: 'muted small' }, 'First score recorded')),
    lines,
    el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: again }, 'Go again'), el('button', { class: 'btn', onclick: back }, 'Done')));
}

'use strict';
const LESSONS = [];
const L = (id, t, title, src, why, how, ex, doit, drill, dopt, q, a) => LESSONS.push({ id, t, title, src, why, how, ex, do: doit, drill, dopt, q, a });

/* ============ LEARNING FOUNDATIONS ============ */
L('f1', 'foundations', 'FAST: four switches for learning anything', ['kwik-sb'],
  'Most slow learning comes from four avoidable habits: thinking you already know it, sitting passively, being in a flat mood, and learning only for yourself. Jim Kwik packs the fixes into one word, FAST.',
  ['<b>Forget.</b> Set aside what you think you know, anything that is not urgent, and your beliefs about your limits. Park stray thoughts on paper rather than fighting them.',
    '<b>Active.</b> Learning is not a spectator sport. Take notes, answer the questions out loud, do the exercise.',
    '<b>State.</b> Information combined with emotion becomes a long-term memory. Sit up, breathe, get curious on purpose before you start.',
    '<b>Teach.</b> Learn as if you must explain it to someone tomorrow. You will pay closer attention and organise it better.'],
  null, 'Pick one thing you want to learn this month. Before your next session, write one line for each letter: what you will set aside, how you will stay active, the state you will bring, and who you will teach.', 'focus', null,
  'What do the letters in FAST stand for?', 'Forget (what you know, distractions, limits), Active, State, Teach.');

L('f2', 'foundations', 'MOM: why you forget, and the fix', ['kwik-sb'],
  'There is no good or bad memory, only a trained or an untrained one. When you forget something, one of three things was missing, and Kwik\'s MOM gives you a checklist for which.',
  ['<b>Motivation.</b> Ask why this is worth remembering. A reason turns attention on; without one the brain discards the input.',
    '<b>Observation.</b> Most "forgetting" is never having noticed in the first place. Be present and really listen or look.',
    '<b>Mechanics.</b> The step-by-step techniques in this app: pictures, links, pegs and places.'],
  'You forget a name seconds after hearing it. That is usually an observation failure: you were thinking about what to say next.',
  'Next time you meet someone or read a page, run the check in order: Why do I care? Am I actually paying attention? Which technique am I using?', 'names', { n: 4 },
  'In MOM, what do the three letters stand for?', 'Motivation, Observation, Mechanics.');

L('f3', 'foundations', 'Kill the ANTs: beliefs that cap your learning', ['kwik-sb', 'alb'],
  'Your self-talk works like a program. Tell yourself "I am terrible with names" and you stop trying to remember them. Kwik calls these Automatic Negative Thoughts; the Accelerated Learning Blueprint covers the same ground as growth mindset.',
  ['Catch the sentence. Notice each "I can\'t", "I\'m not a maths person", "I always forget".',
    'Add one word: <i>yet</i>. "I do not have a good memory for numbers yet."',
    'Replace it with evidence. Use the drills here: a first score and a better score a week later is proof the skill is trainable.',
    'Tidy your surroundings too. A clear desk and a phone in another room remove a steady source of distraction.'],
  null, 'Write down the one belief about your memory or learning you repeat most often. Rewrite it with "yet", then run any drill twice and note both scores.', 'chain', { n: 10 },
  'What is an ANT, in Kwik\'s terms?', 'An Automatic Negative Thought: limiting self-talk that becomes self-fulfilling.');

L('f4', 'foundations', 'The ten keys to a better brain', ['kwik-sb'],
  'Technique sits on top of biology. Kwik lists ten lifestyle keys; no memory method makes up for neglecting them. (He also memorises this list forwards and backwards in the course as a demonstration.)',
  ['A good brain diet.', 'Killing ANTs (automatic negative thoughts).', 'Exercise: as your body moves, your brain grooves.', 'Brain nutrients; he suggests testing for gaps rather than guessing.', 'A positive peer group.', 'A clean environment.', 'Sleep.', 'Brain protection (wear the helmet).', 'New learning, every day.', 'Stress management.'],
  null, 'Score yourself 1–10 on each key. Circle the lowest. Choose one small action for it this week. Then memorise the ten keys using the Body List lesson.', 'pegs', { list: 'body' },
  'Name five of Kwik\'s ten brain keys.', 'Brain diet, killing ANTs, exercise, brain nutrients, positive peer group, clean environment, sleep, brain protection, new learning, stress management.');

L('f5', 'foundations', 'Sleep, naps and stress', ['kwik-sb', 'alb'],
  'Memories are consolidated during sleep. Studying and then sleeping badly is like training hard and skipping the meal afterwards: you throw away much of the gain.',
  ['Protect the night after a learning day. Keep a regular bedtime and a dark, cool room.', 'Do a short review of the day\'s key points in the evening; let sleep do the filing.', 'If you are fading in the afternoon, a short nap of 10–20 minutes restores alertness without grogginess.', 'Lower stress before you study: slow breathing for a minute, a short walk, or the attention exercises in this section.'],
  null, 'Tonight, spend three minutes before bed recalling (not rereading) the main points of what you learned today.', 'focus', null,
  'Why does sleep matter for learning?', 'Consolidation into long-term memory happens during sleep; poor sleep after study wastes much of the session.');

L('f6', 'foundations', 'A morning routine that primes the brain', ['kwik-sb'],
  'Win the first hour and the day follows. In Superbrain, Kwik walks through the morning habits he uses to jump-start his brain, so that good choices do not depend on willpower.',
  ['Recall your dreams for a moment before you get up.', 'Make your bed: a clean environment and a first small win.', 'Drink a large glass of water. The brain is mostly water.', 'Brush your teeth with the opposite hand to give the brain something new.', 'Do a few minutes of deep breathing. The brain is about 2% of body weight and uses about 20% of its oxygen.', 'Have a tea or drink you like, and journal while you drink it: plans for the day and what you are grateful for.', 'Then a few minutes of brisk exercise, a brain-food smoothie, and 20–30 minutes of reading.', 'Choose a few of these and run them in the same order every day until the sequence is automatic.'],
  null, 'Write a five-step morning routine from this list that takes under 30 minutes. Run it for seven days before changing anything.', null, null,
  'Name three habits from Kwik\'s morning routine.', 'Recall dreams, make the bed, drink water, brush teeth with the opposite hand, deep breathing, tea and journaling with gratitude.');

L('f7', 'foundations', 'Four rules of neuroplasticity', ['alb'],
  'The brain changes physically in response to demand, much as a muscle does. The Accelerated Learning Blueprint reduces the conditions for that change to four rules.',
  ['<b>Motivation.</b> You need a real want, or a real discomfort to move away from. That tension signals the brain that change is needed.', '<b>Chunk.</b> Slice both the material and the time into small pieces.', '<b>Make errors.</b> Practise at the edge where you fail often. Errors are the trigger for change, not a sign it is not working.', '<b>Repeat.</b> Come back the next day and the day after. Once is not enough.'],
  'Ten historical dates: split them into groups of three or four, test yourself, get some wrong, and repeat tomorrow.',
  'Choose a drill here that you find hard. Set it one notch above comfortable so you miss about a third. That is the right difficulty.', 'numrun', { n: 10, sec: 4 },
  'Why are errors useful during practice?', 'Failing at the edge of your ability is what signals the brain to change; it is the trigger for neuroplasticity.');

L('f8', 'foundations', 'Work in sprints: Pomodoro and active breaks', ['alb', 'kwik-sb'],
  'Attention fades in a predictable curve. Short timed blocks keep you in the high part of it, and you remember the start and end of a session best, so more sessions mean more starts and ends.',
  ['Set a timer for 25 minutes and work on one thing only.', 'Take a 5-minute break. Stand up and move: a short walk, stretches, juggling, or cross-body movements. Do not open social media.', 'After four blocks, take a longer break.', 'Do the hardest task first, while your energy is highest ("eat the frog").'],
  null, 'Run one Focus Session now with a written question, then take an active break.', 'focus', null,
  'What should a break between study blocks contain?', 'Movement away from the screen, not more input: walk, stretch, juggle, breathe.');

L('f9', 'foundations', 'Capture and create: notes that make you think', ['kwik-sb'],
  'Copying down what you hear is transcription, not learning. Kwik\'s method splits the page so that half of your note-taking is thinking.',
  ['Draw a vertical line down the page. Handwrite if you can: you cannot write everything, so you are forced to choose what matters.', 'Left side: <b>capture</b>. Key ideas, how-tos, facts.', 'Right side: <b>create</b>. Your questions, how you will use it, what it reminds you of, who you will teach it to.', 'Afterwards, review the right side first. It holds the part that is yours.'],
  null, 'Take capture/create notes on the next lesson you open in this app, on paper.', null, null,
  'What goes on the right-hand side of a capture/create page?', 'What you create: questions, applications, connections and how you would teach it.');

L('f10', 'foundations', 'The forgetting curve and spaced review', ['kwik-sb', 'mm', 'gms', 'alb'],
  'Without review, most new material fades within days. Cramming feels productive but produces short-lived memories. Reviews spread over time are what move information into long-term memory.',
  ['Test yourself soon after learning: the same day.', 'Review again after a day, then after a few days, a week, a month. Each successful recall earns a longer gap.', 'Review by recalling from memory, not rereading. In the GMS method you first do a full test recall and fix mistakes, then repeat mentally.', 'Let the Review tab schedule this for you. Each lesson you complete adds a card.'],
  null, 'Open Review and add one ready-made deck. Do today\'s cards. Come back tomorrow: that return is the technique.', null, null,
  'Why is cramming a poor strategy?', 'Massed study gives short-lived memories; spaced recall over days is what builds long-term retention.');

L('f11', 'foundations', 'Training attention', ['gms', 'kwik-sb'],
  'Attention is like the hand of a clock: it points at one thing at a time and tends to drift. The School of Phenomenal Memory uses short "psycho-technical" exercises to learn to move it on purpose.',
  ['<b>Fingers.</b> Interlock your hands, close your eyes and circle your thumbs around each other without touching, for 1–2 minutes. The sensation holds your attention and thoughts quieten.', '<b>Breathing.</b> Watch your breath without changing its rhythm. If it speeds up or slows down, you are controlling it, not observing it.', '<b>One object.</b> Hold a simple object in your mind\'s eye. Rotate it, enlarge it, shrink it.', 'Use one of these for a minute before any memorisation session.'],
  null, 'Do the finger exercise for 90 seconds, then run a Schulte table and compare your time with a cold start.', 'schulte', null,
  'In the breathing exercise, what shows you are doing it wrong?', 'Your breathing rhythm changes. You should observe it without controlling it.');

L('f12', 'foundations', 'Beating procrastination', ['kwik-sb', 'alb', 'sy'],
  'Putting learning off is rarely about time. It is usually that the task is too large or too vague to start.',
  ['Shrink it. Ask what the smallest possible step is: one page, one drill, five minutes.', 'Start with the hardest thing while you are fresh.', 'Attach the session to something you already do every day, at the same time and place.', 'Use weekly and daily goals: decide the week\'s list once, then each morning pick the day\'s items and stop when they are done.', 'Be kind about slips. Missing one day is nothing; the rule is never to miss two.'],
  null, 'Decide your fixed daily time for this app and the trigger it follows (after coffee, on the tram). Do one five-minute drill right now to start the chain.', 'math', { cat: 'add2' },
  'What is the first move when you keep putting a task off?', 'Shrink it to the smallest step you can start immediately.');

/* ============ MEMORY TECHNIQUES ============ */
L('m1', 'memory', 'Turn it into a picture', ['kwik-sb', 'gms'],
  'We remember what we see far better than what we hear or read. Kwik\'s "ultimate memory TIP" is Turn Into Picture. The GMS method is built on the same fact: the brain stores connections between images.',
  ['For anything you want to keep, ask: what does this look like?', 'Make the image large, three-dimensional, detailed and in colour. A vague or flat picture does not hold.', 'Use one specific object, not a category: not "a dog" but a particular wet labrador.', 'Abstract word? Use a symbol (justice = scales) or a sound-alike (see the keyword lesson).'],
  'Shopping list item "honey": see a heavy glass jar, amber, sticky, the lid half off, a slow drip down the side.',
  'Take the first five words in a Chain Link list and spend five seconds on each, building the image in full detail before you link anything.', 'chain', { n: 10 },
  'What does TIP stand for?', 'Turn Into Picture.');

L('m2', 'memory', 'Connect two images at a time', ['gms', 'kwik-sb'],
  'A memory is a connection. In the GMS model you never memorise an item on its own; you join two images and the brain records the join. Do it properly once and one image later recalls the other.',
  ['Take exactly two images. Never try to link three at once.', 'Make them similar in size and put them in contact: one on, in, or piercing the other.', 'Hold the combined picture clearly for a few seconds. In GMS training the standard is about six seconds per connection.', 'Add action, exaggeration and feeling, as Kwik teaches: the stranger and more vivid, the stickier.', 'Then move on. Do not go back over it during memorising.'],
  'Candle + bicycle: a huge lit candle jammed through the front wheel, wax splattering as the wheel turns.',
  'Run Number Run at 8 seconds with 10 numbers and concentrate only on making each connection clean.', 'numrun', { n: 10, sec: 8 },
  'How many images do you connect at once?', 'Two. Always link in pairs.');

L('m3', 'memory', 'Chain linking: lists forwards and backwards', ['kwik-sb', 'gms', 'sy'],
  'Linking each item to the next lets you hold a long list in order after one pass. Kwik uses it to have students recall ten random words forwards and backwards on the first try.',
  ['Picture item 1 vividly.', 'Link item 1 to item 2 with an action picture. Then forget item 1 and link 2 to 3, and so on.', 'To recall, start at the first image and ask what it was doing; each image hands you the next.', 'To recall backwards, start from the last and follow the links the other way.', 'Weakness: one broken link loses what follows. For long or important lists use pegs or a palace.'],
  'Fire hydrant → balloon → battery: a hydrant spraying out balloons; a balloon that bursts and batteries rain down.',
  'Do Chain Link with 10 words. When you score 10, move to 15, then 20.', 'chain', { n: 10 },
  'What is the main weakness of a chain?', 'If one link fails you can lose everything after it; there is no direct access to item 7.');

L('m4', 'memory', 'The Russian Doll method', ['gms'],
  'A GMS alternative to the chain that keeps a sequence compact. Each new image is placed on a part of the previous one, at a much smaller scale, like nested dolls.',
  ['See the first image large.', 'Zoom in on one part of it and attach the second image there, small.', 'Now enlarge the second image until it fills your view, pick a part of it, and attach the third.', 'To recall, zoom in step by step.'],
  'Guitar → key → snail: a tiny key hanging from a tuning peg of the guitar; zoom into the key, and a tiny snail sits on its teeth.',
  'Memorise a 10-word list using only this method and compare your score with the chain.', 'chain', { n: 10 },
  'How does the Russian Doll method differ from a chain?', 'Each next image is attached, much smaller, to a part of the previous image, and you zoom in to move along.');

L('m5', 'memory', 'The Sun List: ten instant pegs', ['kwik-sb'],
  'A peg is a hook that is always in the same place. Kwik\'s first peg list uses things that naturally come in that number, so it takes minutes to learn.',
  ['Learn the list: 1 sun, 2 socks, 3 traffic light, 4 car doors, 5 star, 6 six-pack of soda, 7 rainbow, 8 octopus, 9 cat, 10 toes.', 'To store ten items, link item 1 to the sun, item 2 to the socks, and so on.', 'To recall item 7, think "rainbow" and see what is on it.', 'You can now answer in any order, which a chain cannot do.'],
  null, 'Learn the Sun List in the Peg Lists drill, quiz yourself, then hang ten random items on it.', 'pegs', { list: 'sun' },
  'In the Sun List, what are 3, 6 and 8?', 'Traffic light, six-pack of soda, octopus.');

L('m6', 'memory', 'The Body List: pegs you carry with you', ['kwik-sb'],
  'Your body gives you ten places in a fixed order, top to bottom. Kwik uses it to memorise ten brain foods and shopping lists; it works for any ten points.',
  ['Touch each place as you say it: 1 top of head, 2 nose, 3 mouth, 4 ears, 5 larynx (throat), 6 shoulders, 7 collar, 8 fingers, 9 belly, 10 seat.', 'Put one image on each place and feel it there: blueberries stuffed up your nose, broccoli growing out of your ears.', 'Recall by walking down the body.', 'Touching the place while imagining adds a physical cue to the visual one.'],
  null, 'Use the Body List to memorise the ten brain keys from Learning Foundations, then test yourself in the drill.', 'pegs', { list: 'body' },
  'What are places 5, 7 and 10 on the Body List?', 'Larynx (throat), collar, seat.');

L('m7', 'memory', 'Peg systems: storing by number', ['kwik-sb', 'mm', 'sy'],
  'Any fixed, numbered set of images can serve as pegs: rhymes (one-bun, two-shoe), shapes, the alphabet, or the 100 number images you will build later. Scott Young notes that pegs suit ordered facts that have little internal logic.',
  ['Choose a peg set and overlearn it until each number gives its image instantly.', 'Link each item to its peg with a two-image connection.', 'Reuse pegs for short-term lists; old images fade within a day or two. For permanent knowledge use a dedicated route.', 'Longer lists: combine sets (Sun List 1–10, Body List 11–20) or use the 00–99 number images.'],
  null, 'Learn the rhyme pegs and compare how they feel against the Sun List.', 'pegs', { list: 'rhyme' },
  'When are pegs better than a chain?', 'When you need direct access by number, or the items have no natural order or logic of their own.');

L('m8', 'memory', 'The location method (memory palace)', ['kwik-sb', 'gms', 'sy', 'gms-cards'],
  'The oldest and strongest technique. GMS calls it the Cicero method; Kwik calls it the location method. You already remember places effortlessly, so you borrow them as storage.',
  ['Choose a place you know well and fix a route through it in one direction.', 'Pick distinct stops along the route: door, coat hooks, sofa. About ten per room.', 'Walk the route in your mind until the stops come without effort.', 'Place one image at each stop, interacting with it.', 'To recall, walk the route and look at each stop.'],
  'Speech point 1, "costs": a mountain of coins blocking your front door. Point 2, "the team": your colleagues hanging from the coat hooks.',
  'Open Memory Palace, enter a real route of ten stops from your own home, and practise storing ten words on it.', 'palace', null,
  'What are the two things a memory palace needs before you can use it?', 'A fixed route direction and a set of distinct stops you can recall effortlessly.');

L('m9', 'memory', 'Building a large system of support images', ['gms'],
  'Serious memorising needs hundreds of storage places. The GMS approach multiplies a small number of routes into a large, numbered system.',
  ['Start with routes (the Cicero method): ten objects in each of several rooms or streets.', 'On each object, single out five parts in a fixed order, for example left to right or top to bottom. One chair gives five stops: back, armrest, seat, leg, wheel.', 'Number the result. Ten objects × five parts = 50 places from one room.', 'Fix the system with mental walk-throughs until any place comes instantly, then use it only for storage.', 'Keep separate systems for practice and for knowledge you want to keep for good.'],
  null, 'Take the route you built in the last lesson. For the first four stops, name five parts each and add them as a new 20-stop route.', 'palace', null,
  'How does GMS turn one object into five storage places?', 'By singling out five parts of the object in a fixed order and using each part as its own support image.');

L('m10', 'memory', 'Names: BE SUAVE', ['kwik-sb'],
  'Forgetting names is mostly an attention problem. Kwik\'s BE SUAVE is a routine for the first thirty seconds of meeting someone.',
  ['<b>Believe</b> you can. Drop "I am bad with names".', '<b>Exercise</b>: it takes practice.', '<b>Say</b> the name back at once: "Ted, good to meet you." You catch mishearings immediately.', '<b>Use</b> it a few times in conversation, not in every sentence.', '<b>Ask</b> about it: spelling, origin, who they were named after.', '<b>Visualise</b> it: turn the name into a picture.', '<b>End</b> with the name when you say goodbye.'],
  null, 'Use Say, Use and End on the next three people you speak to today, even ones you know. Then train the Visualise step in the drill.', 'names', { n: 6 },
  'In BE SUAVE, what are the S, U and A?', 'Say the name, Use the name, Ask about the name.');

L('m11', 'memory', 'Names to faces: PIE, the forehead trick and distinctive features', ['kwik-sb', 'gms'],
  'To keep a name attached to a person you need a hook on the person. Kwik\'s PIE does it in three moves; GMS trains the same skill as "singling out a distinctive feature".',
  ['<b>Place.</b> Pick the first feature that stands out to you: eyebrows, glasses, a beard, hair. In GMS terms, the distinctive feature.', '<b>Imagine.</b> Turn the name into a picture. Mike = microphone; Rosa = a rose; Baker = a loaf.', '<b>Entwine.</b> Join the picture to the feature: a microphone tangled in his beard.', 'Quick alternative, credited to Franklin D. Roosevelt: imagine the name written across the person\'s forehead.', 'Avoid features that change, such as clothing, for people you will meet again.'],
  null, 'Run Names & Faces with 6 people, using PIE on every face. Move to 9 when you get them all.', 'names', { n: 6 },
  'What does PIE stand for?', 'Place, Imagine, Entwine.');

L('m12', 'memory', 'Keyword substitution', ['kwik-sb', 'gms', 'sy'],
  'Abstract or unfamiliar words do not make pictures by themselves. Substitute a familiar word that sounds similar and picture that. GMS calls this encoding by consonance; it is the engine behind vocabulary, names and technical terms.',
  ['Say the word aloud and listen for a familiar sound inside it.', 'Picture the sound-alike, not the original word.', 'Link that picture to an image of the meaning.', 'Recall runs: hear the word → sound-alike image → linked meaning.'],
  '"Mitochondria" → "mighty con dryer": a muscular conman holding a hairdryer that powers a whole city (the cell\'s power plant).',
  'Take five technical terms from something you are studying. Write a sound-alike and one image for each, then add them as cards in Review.', null, null,
  'What do you picture when a word is abstract or unfamiliar?', 'A familiar word that sounds like it, linked to an image of the meaning.');

L('m13', 'memory', 'Foreign vocabulary', ['kwik-sb', 'gms', 'sy'],
  'Vocabulary is the largest memory load in a language. The image method lets you take in dozens of words per session, where rote repetition manages a handful.',
  ['Picture the meaning as a concrete image first.', 'Find a sound-alike in your own language for the foreign word (keyword substitution).', 'Link the two images.', 'Say the real word aloud several times while holding the picture. GMS stresses this step: the image gets you to the word, the pronunciation must be practised.', 'Store new words on a route so you can review them all without a list, and review on a spaced schedule.'],
  'Spanish <i>pato</i> (duck): a duck you pat on the head. French <i>pomme</i> (apple): an apple on a cheerleader\'s pom-pom.',
  'Choose ten words from a language you are learning. Build the images, then add them as cards in Review.', null, null,
  'What must you add to the image so you can actually say the word?', 'Repeated aloud pronunciation of the real word while holding the image.');

L('m14', 'memory', 'Numbers: give them meaning', ['kwik-sb', 'gms'],
  'Digits are the hardest thing to remember because they are abstract and all look alike. Every number technique does the same thing: converts digits into something with meaning.',
  ['Chunk first. 4 9 2 1 7 7 6 is hard; 492 – 1776 is two items.', 'Look for meaning you already own: dates, ages, prices, sports numbers.', 'For anything longer, convert digits to images with a code (next lessons) and place the images on pegs or a route.', 'Always link a number to what it belongs to. A PIN with no link to its card is useless.'],
  null, 'Run Number Run with 10 numbers before learning a code. Record the score: that is your baseline to beat.', 'numrun', { n: 10, sec: 6 },
  'What is the common principle behind all number techniques?', 'Convert abstract digits into something meaningful (chunks, known facts or images) and link it to what it belongs to.');

L('m15', 'memory', 'The Major system: digits become sounds', ['kwik-sb', 'gms-cards'],
  'The classic phonetic code, which Kwik teaches as the "ancient alphanumeric code", gives each digit a consonant sound. Vowels are free, so any number can be turned into a word.',
  ['0 = s, z · 1 = t, d · 2 = n · 3 = m · 4 = r', '5 = l · 6 = j, sh, ch, soft g · 7 = k, hard g · 8 = f, v · 9 = p, b', 'Memory hooks: t has one downstroke, n two, m three; "four" ends in r; L is 50 in Roman numerals; 8 looks like a handwritten f; 9 is a mirrored p.', 'It is the sound that counts, not the spelling: "phone" = f-n = 82; "knee" = n = 2.', 'Vowels and w, h, y carry no value. Use them as filler.'],
  '32 = m-n = moon. 94 = b-r = bear. 1492 = t-r-p-n = "turban".',
  'Open Number Code and run the Sounds sprint until you reach 40 correct in a minute.', 'codes', null,
  'In the Major system, which sounds stand for 3, 7 and 9?', '3 = m; 7 = k or hard g; 9 = p or b.');

L('m16', 'memory', 'Your 100 number images', ['kwik-sb', 'gms', 'gms-cards'],
  'Fluent number memory comes from having one fixed image for every pair from 00 to 99, so that you read digits two at a time as pictures.',
  ['Use the sounds to build a word for each pair: 00 sauce, 01 suit, 02 sun … 99 pipe. The app has a starter list.', 'Replace any word that does not give you an instant, concrete picture. Your own choice sticks better.', 'Drill until each number brings its image in under a second. GMS calls this reflex level and tests it against the clock.', 'To memorise a long number, split it into pairs and chain the images or place them on a route.'],
  '3.14159265 → 14 tire, 15 doll, 92 pen, 65 jail: a tyre rolls over a doll, who stabs it with a pen, and is taken to jail.',
  'Edit your 100 images in Number Code, then run Image check daily until 18 of 20 are instant.', 'codes', null,
  'What is "reflex level" for number images?', 'The image appears instantly, in under about a second, without working out the sounds.');

L('m17', 'memory', 'The GMS number code and figurative codes', ['gms'],
  'The School of Phenomenal Memory uses its own consonant code and a wider idea: a "figurative code" is any fixed image standing for a frequently used element, not only numbers.',
  ['GMS digits: 1 N · 2 T, H, Z · 3 B · 4 W, V, K · 5 F, R · 6 J, P, X · 7 S, D · 8 G, Q, L · 9 C · 0 M.', 'Words are chosen from the first consonants: 35 = B + F/R = BeeR; 25 = H + R = HaRe.', 'Build the same kind of fixed images for months, weekdays and letters, so dates and codes become pictures too.', 'Rule: figurative codes are attached to another image (an "association base"); they are not used as bases themselves, because the same code recurs in many memories.', 'Choose one number code, this or the Major system, in Settings and stay with it.'],
  null, 'If you prefer this code, switch to it in More → Settings and start filling in your own 100 images. Otherwise invent images for the twelve months and write them on paper.', 'codes', null,
  'What is a figurative code in GMS?', 'A fixed, pre-learned image that stands for a recurring element such as a two-digit number, month, weekday or letter.');

L('m18', 'memory', 'Phone numbers, dates and codes', ['gms', 'mm'],
  'Precise data needs two things: the digits as images, and a firm link to what they belong to. The GMS course trains this on dozens of everyday information types.',
  ['Create an image for the owner of the data: the person, the bank card, the historical event. This is the association base.', 'Convert the number into pair images.', 'Attach the images to different parts of the base, in a fixed order (top to bottom, or left to right).', 'Dates: month image + day image + year image on the event image.', 'Test recall immediately, then review on a spaced schedule.', 'Practise with invented numbers. The app never asks for and never stores your real PINs, passwords or account numbers; keep those in your head only.'],
  'A dentist\'s number ending 47 15 92: a giant tooth with a rock on top, a doll in the middle and a pen stuck in the root.',
  'Invent a phone number for a made-up person, memorise it with this method, and test yourself in an hour.', 'numrun', { n: 10, sec: 6 },
  'What is an association base?', 'The image of the thing the data belongs to, onto whose parts you attach the images for the data.');

L('m19', 'memory', 'Give a speech without notes', ['kwik-sb'],
  'You do not memorise a talk word for word. You memorise the order of the ideas, and speak naturally about each. Kwik teaches this with the location method.',
  ['Write the talk, then reduce it to 8–12 key points.', 'Turn each key point into one image.', 'Place the images in order on a route: your home, or better, the room you will speak in.', 'Rehearse by walking the route in your mind and talking through each stop.', 'On stage, glance at each location in your mind for the next point.'],
  null, 'Outline a two-minute talk on a topic you know. Place five key images on a route and deliver it aloud without looking at the outline.', 'palace', null,
  'What do you memorise for a speech?', 'The sequence of key ideas as images on a route, not the exact words.');

L('m20', 'memory', 'Memorising text word for word', ['kwik-sb', 'gms'],
  'Poems, quotes, lines and scripts sometimes must be exact. Kwik, who coaches actors on learning lines, gives eight keys that all start with R. GMS adds a way to hold the order.',
  ['<b>Read</b> it, and <b>Reflect</b>: understand it and make it mean something to you.', '<b>wRite</b> it out by hand.', '<b>Role-play</b>: say it aloud with movement and gesture, as you will deliver it.', '<b>Reform</b>: rehearse in odd voices, tempos and accents. Novelty makes it stick.', '<b>Ration</b>: cut it into bite-sized pieces and learn in short sessions. You remember the starts and ends of sessions best.', '<b>Record</b> it and listen while walking or exercising.', '<b>Rouse</b> the senses: rehearse in the room you will perform in, or tie the material to a particular scent.', 'To lock the order (GMS): one image for the key word of each phrase, placed along a route.'],
  null, 'Choose a four-line quote or verse you like. Use at least four of the R\'s today and recite it tomorrow morning without looking.', 'palace', null,
  'Name four of Kwik\'s eight R\'s for memorising lines.', 'Read, Reflect, wRite, Role-play, Reform, Ration, Record, Rouse.');

L('m21', 'memory', 'Playing cards: four systems compared', ['gms-cards', 'gms'],
  'A shuffled deck is the standard test of a trained memory, and a good workout for images and routes. The Memory Experts\' Tools course compares four ways to give each card an image.',
  ['<b>Loci first.</b> Whatever the system, the images are stored along a route.', '<b>Major system.</b> Suit gives the first consonant, value the second: one object per card.', '<b>Dominic system.</b> Each card becomes a person from two initials; people are easier to picture than objects.', '<b>PAO.</b> Each card has a Person, an Action and an Object. Three cards make one scene, so a deck needs only 18 stops.', '<b>Ben system.</b> Suit pairs and values give a syllable, so two cards become one image. Fastest, and by far the most to learn.', 'Beginners: start with one object or person per card.'],
  null, 'Decide images for the thirteen hearts today. Then memorise 10 cards in Card Deck.', 'cards', { n: 10 },
  'Why does a PAO system need only 18 locations for 52 cards?', 'Three cards combine into one Person-Action-Object scene per location.');

L('m22', 'memory', 'Fixing memories: active repetition', ['gms', 'kwik-sb', 'mm'],
  'Memorising creates the connection; repetition makes it permanent. GMS is strict about how: repetition is done from memory, never by rereading.',
  ['Right after memorising, do a complete test recall. Write it down and compare with the source.', 'Fix any errors or gaps with fresh connections.', 'Only then start repeating: walk your support images and look at what is on each, fully recalling every element.', 'Repeat the same day, the next day, then at growing intervals. A few correct recalls spread over weeks beat dozens in one evening.', 'When a fact answers instantly without the image, it has become knowledge. Let the image fade.'],
  null, 'Recall yesterday\'s route or peg list from memory before looking at anything. Then do your cards in Review.', null, null,
  'In GMS, what must happen before repetition starts?', 'A full test recall compared with the source, with every error corrected.');

'use strict';
/* ============ STUDY METHODS ============ */
L('l1', 'learning', 'Holistic learning: understand, do not just store', ['sy'],
  'Scott Young\'s central idea is that ideas you connect to other ideas rarely need memorising. Rote learners store isolated facts; fast learners build a web, so each new fact has several things holding it in place.',
  ['When you meet a new idea, ask three questions: What is this like? What does it look or feel like? How could I use it?', 'Simplify and connect: reduce the idea to its core, then link it to something you already understand well.', 'Reserve pure memory techniques for arbitrary information: names, dates, vocabulary, formulas.', 'Test understanding by explaining, not by rereading.'],
  null, 'Take one idea you learned this week. Write three links: to another idea in the same subject, to a different subject, and to your daily life.', 'explain', null,
  'What kind of information still needs pure memory techniques?', 'Arbitrary information with little internal logic: names, dates, vocabulary, formulas.');

L('l2', 'learning', 'Metaphor', ['sy', 'alb'],
  'Young calls metaphor the trunk of the holistic learning tree. A good comparison lets a new idea borrow the understanding you already have of an old one. You already do this by accident; the skill is doing it deliberately, including in technical subjects.',
  ['State the idea in one plain sentence.', 'Ask what familiar thing behaves the same way.', 'Check where the comparison holds and where it breaks. Finding the break teaches you as much as the fit.', 'Collect two or three different metaphors for hard ideas; comparing them sharpens the picture.', 'Stuck? An AI assistant is good at proposing analogies. Judge and adapt them yourself.'],
  'Voltage and current: water in a pipe. Pressure is voltage, flow is current. It breaks down because electricity does not leak out of an open wire.',
  'Write a metaphor for one concept in Explain It Simply, including where it breaks.', 'explain', null,
  'What should you always check about a metaphor?', 'Where it stops matching the real idea.');

L('l3', 'learning', 'Visceralization', ['sy'],
  'Visualization with the other senses added: sound, movement, weight, texture. Young describes the difference as a silent black-and-white film against one in 3D. It makes abstract ideas tangible and works best exactly where pictures do not come by themselves: maths, physics, programming.',
  ['Pick an abstract idea or formula.', 'Give it a body: what would you see, hear and feel if it were a physical thing?', 'Add motion. What happens as a quantity grows or a step runs?', 'Sketch it roughly if that helps; accuracy matters less than vividness.'],
  'A derivative: you are standing on a hillside curve and the slope under your feet tilts you forward or back as you walk.',
  'Choose one formula or abstract rule you use and write a visceral picture for it.', 'explain', null,
  'How does visceralization differ from visualization?', 'It adds sound, movement and physical sensation to the mental picture.');

L('l4', 'learning', 'The five-year-old method', ['sy'],
  'If you had to explain your subject to a five-year-old, how would you do it? The age does not matter. The exercise forces two things you might otherwise skip: explaining the idea to yourself, and breaking it into simpler parts. It exposes weak spots long before an exam does.',
  ['Write the concept at the top of a page.', 'Explain it in simple words and short sentences, with no jargon.', 'Wherever you stall or reach for a technical term, mark it. That is the gap.', 'Go back to the source for the gaps only, then explain again.'],
  null, 'Do one full round in Explain It Simply on something you believe you already understand.', 'explain', null,
  'What two things does the five-year-old method force you to do?', 'Explain the concept to yourself, and reduce it to simpler components.');

L('l5', 'learning', 'Flow-based note-taking', ['sy'],
  'Traditional notes try to copy the lecture in order. Flow-based notes record your own mental picture of the subject as it forms, so the learning happens during the lecture and not weeks later.',
  ['Write only the important ideas, in few words.', 'Draw arrows between related ideas as you notice the links.', 'Go back and add to earlier parts of the page; do not write strictly top to bottom.', 'Put it in your own form: small diagrams, metaphors, examples.', 'Limit: when exact detail matters, or the material is new and fast, combine it with normal notes or a recording.'],
  null, 'Watch or listen to ten minutes of any talk and take flow-based notes on one sheet. Then explain the talk from the sheet alone.', null, null,
  'What does flow-based note-taking record instead of the lecture\'s own order?', 'Your own mental picture of the subject: key ideas and the connections between them.');

L('l6', 'learning', 'Active reading', ['sy', 'sr-comp'],
  'Reading with a pen and a set of questions turns a passive activity into study. It is slower per page and far faster per idea retained.',
  ['Before a section, turn its heading into a question.', 'After each section, stop and write in the margin or a notebook: the main point, how you would picture it or what it is like, and how it connects to something earlier.', 'Mark only what answers your question, not everything that looks important.', 'At the end of the chapter, close the book and write a summary from memory.'],
  null, 'Read one chapter or article today this way. Compare what you can recall an hour later with your usual reading.', 'focus', null,
  'What do you write after each section in active reading?', 'The main point, a picture or metaphor for it, and a link to something you already know.');

L('l7', 'learning', 'Deep linking', ['sy'],
  'Young describes three directions in which to link an idea. Deep linking takes more effort up front and saves the time most students spend relearning.',
  ['<b>Lateral:</b> link to another idea at the same level in the same subject.', '<b>Vertical:</b> link to an idea in a different subject or in everyday life.', '<b>Deep:</b> link to the idea\'s foundations. Why is it true? Where does the formula come from? What problem was it invented to solve?', 'For key ideas, do not stop at how to use a rule; trace it back one level.'],
  'Do not only memorise that the area of a circle is πr². Cut the circle into thin wedges, rearrange them into a near-rectangle of height r and width πr, and the formula is obvious.',
  'Pick one formula or rule you use by rote and find out where it comes from. Add the answer as a Review card.', null, null,
  'What does a deep link connect an idea to?', 'Its foundations: why it is true and where it comes from.');

L('l8', 'learning', 'The branch method and mental debugging', ['sy'],
  'When you cannot "get" something, the cause is usually a missing or weak prerequisite further down the chain, not a lack of ability. Metaphors and pictures only help once you roughly understand; before that you have to find the broken link.',
  ['Write the idea you are stuck on at the top.', 'Below it, list what you need to understand first. Under each of those, list their prerequisites, like branches.', 'Test each branch quickly. The first one you cannot explain is where to study.', 'Debugging also applies afterwards: when you get a problem wrong, find the exact step where your thinking left the correct path and fix that step.'],
  null, 'Take one topic you find confusing and draw its branch diagram down to things you are sure of.', null, null,
  'What is the usual reason you cannot grasp a new concept?', 'A prerequisite it depends on is missing or too weak.');

L('l9', 'learning', 'Notes compression and study dissection', ['sy'],
  'Two of Young\'s tools for large volumes of material. Compression forces synthesis; dissection replaces the vague instruction "study" with a specific plan.',
  ['<b>Compression:</b> take one large blank sheet and fit the major ideas of the whole course or topic onto it, in tiny writing, diagrams and links. Deciding what earns space is the learning.', '<b>Dissection:</b> split the material by type. What must be understood (concepts), what must be memorised (arbitrary facts), and what must be practised (procedures)?', 'Assign each type its method: explanation and metaphor for concepts, memory techniques and flashcards for facts, timed problems for procedures.', 'Study from the plan, not from page one.'],
  null, 'Compress one topic you are studying onto a single page this week.', null, null,
  'In study dissection, what three types do you sort material into?', 'Concepts to understand, arbitrary facts to memorise, and procedures to practise.');

L('l10', 'learning', 'Deliberate practice, projects and apply-first', ['sy', 'alb'],
  'Skill comes from doing, at the edge of your ability, with feedback. Young argues for reversing the school order when learning for yourself: try to apply first, then learn the correct method.',
  ['Pick a small real project that needs the skill.', 'Attempt the problem before reading the solution. The struggle primes you to absorb the method.', 'Isolate your weakest sub-skill and drill that alone.', 'Get fast feedback: answers, a tutor, a test, or running the code.', 'Schedule practice blocks in your week instead of waiting for free time.'],
  null, 'Define one mini-project for a skill you are learning, small enough to finish in a week. Write it down with a deadline.', null, null,
  'What does "apply first" mean?', 'Attempt to use or solve before being taught the method, then learn the correct approach.');

L('l11', 'learning', 'Active recall: test, do not reread', ['alb', 'mm', 'anki', 'kwik-sb'],
  'Pulling information out of memory strengthens it far more than putting it in again. Rereading and highlighting feel fluent and teach little.',
  ['Study the material once, properly.', 'Take a break.', 'Close everything and reproduce it: write, speak, or answer questions.', 'Check against the source, correct, and repeat later.', 'Flashcards are active recall in small units. An AI assistant can also write you a quiz from your notes.'],
  null, 'Run a Focus Session and complete the brain dump at the end without looking at your material.', 'focus', null,
  'Why is rereading weak?', 'It feels fluent but does not make you retrieve; retrieval is what strengthens memory.');

L('l12', 'learning', 'Writing good flashcards', ['anki', 'mm', 'alb'],
  'Spaced-repetition software such as Anki only works as well as the cards you feed it. The course in your library covers the tool; these are the principles that carry over to any deck, including the Review tab here.',
  ['Understand first, then make cards. Do not card what you do not understand.', 'One fact per card. Split long answers into several cards.', 'Ask a specific question with one short, unambiguous answer.', 'Use your own words, and add an image or mnemonic when a fact resists.', 'Review every day. A small daily habit beats a weekly marathon, and the algorithm assumes you show up.', 'Suspend or rewrite cards you keep missing; the card is at fault.'],
  null, 'Write five cards in Review from something you studied today, following these rules.', null, null,
  'What is the rule for how much goes on one flashcard?', 'One fact, with a single short answer.');

L('l13', 'learning', 'Starting a new subject with an AI assistant', ['alb'],
  'The Accelerated Learning Blueprint uses a chatbot as a guide to the map of a field before you start walking through it.',
  ['<b>Pareto:</b> ask which 20% of the topics give 80% of the practical ability, and start there.', '<b>Mind map:</b> ask for the main ideas, sub-ideas and how they connect.', '<b>Vocabulary:</b> ask for the terms you must know, in plain words, so later reading is not blocked.', '<b>Others\' mistakes:</b> ask what beginners commonly get wrong.', '<b>Resources and projects:</b> ask for good sources and for small projects that exercise each part.', 'Ask "stupid" questions freely. Verify facts that matter; chatbots can be confidently wrong.'],
  'Prompt: "I want to learn X for the purpose of Y. Which 20% of X will give me 80% of the result? List the key terms a beginner must know."',
  'Run these five questions on a subject you are about to start and save the answers.', null, null,
  'What is the Pareto question for a new subject?', 'Which 20% of the topics will give 80% of the results I want?');

L('l14', 'learning', 'Going deeper with an AI assistant', ['alb'],
  'Once you have the basics, use the assistant to probe, not to replace your thinking. The Blueprint\'s point is that it is a sparring partner, not the final product.',
  ['Explain a concept in your own words and ask whether your understanding is correct.', 'Ask for related concepts and how each one connects to what you know.', 'Ask for two different analogies and compare them.', 'Ask for a 10-question quiz on your notes. Answer before looking.', 'Ask it to turn your notes into flashcards, then edit them.', 'Teach it: explain the topic and ask for the gaps. Knowing something passively is different from being able to produce it.', 'For long texts, skim first, ask for a summary, then read with questions.'],
  null, 'Paste your notes on one topic into an assistant, ask for a 10-question quiz, and add the questions you miss to Review.', null, null,
  'What is the difference between passive and active knowledge?', 'Passive: you recognise and follow it. Active: you can produce and explain it yourself.');

L('l15', 'learning', 'Memorising books and lectures', ['gms', 'sy'],
  'The later GMS courses apply the system to real study material. You do not memorise sentences; you memorise a skeleton that lets you rebuild the content.',
  ['Read a passage and understand it.', 'Give each fragment a short title of your own, a "sense support", and turn the title into an image.', 'Store those images in order on a route. Exact data in the fragment (numbers, names) is attached to its title image.', 'For a whole book, memorise the table of contents first; each heading becomes a place where its section\'s key points hang.', 'Retell each section from its images, compare with the text, then review on a spaced schedule.'],
  null, 'Take one chapter. Write a five-word title for each section, place the titles on a route, and retell the chapter aloud.', 'palace', null,
  'What is a "sense support" in GMS text memorisation?', 'A short title you give a text fragment, turned into an image, from which you can rebuild the fragment.');

/* ============ SPEED READING ============ */
L('r1', 'reading', 'Measure your baseline', ['kwik-sr', 'sr-comp', 'kk'],
  'Reading is a skill most people stopped training at about age ten. The typical adult reads around 200–250 words a minute. You cannot improve what you do not measure.',
  ['Speed is words per minute. Comprehension is how much you can answer afterwards. Your real rate is the two multiplied.', 'Three habits hold speed down: saying every word in your head, jumping back to reread, and taking in one word per glance.', 'Test now, before training, and again each week on a fresh passage.', 'Compare like with like. Dense technical text is always slower than a story.'],
  null, 'Take the Reading Speed Test at your normal pace. Write down the number.', 'wpm', null,
  'How is effective reading rate calculated?', 'Words per minute multiplied by comprehension.');

L('r2', 'reading', 'Use a visual pacer', ['kwik-sb', 'kwik-sr'],
  'Your eyes are drawn to motion. A finger, pen or cursor moving under the line pulls them forward at a steady rate and is the single quickest gain for most readers. Kwik teaches it in both Superbrain and his reading course.',
  ['Run your finger or a pen under each line as you read, smoothly, slightly faster than is comfortable.', 'Look just above the tip. Do not let your eyes run ahead or fall behind.', 'On a screen, use the cursor or the Guide mode of the Pacer drill.', 'It feels childish for about a day. Measure before and after.'],
  null, 'Read with Guide mode in the Pacer at about 20% above your baseline speed.', 'pacer', null,
  'Why does a pacer raise reading speed?', 'The eyes follow motion, so a moving guide keeps them going forward at a steady pace and cuts wandering and rereading.');

L('r3', 'reading', 'Stop back-skipping', ['kwik-sr', 'sr-comp', 'kk'],
  'Regression, the habit of flicking back to reread words, can eat a large share of reading time and breaks the flow of meaning. Much of it is a nervous habit and not a real need.',
  ['Decide before you start that you will keep moving forward.', 'Use the pacer; it does not go backwards.', 'Cover what you have read with a card moving down the page if the habit is strong.', 'If you truly lost the thread, finish the paragraph first, then reread it once on purpose.', 'Trust that the brain fills small gaps from context.'],
  null, 'Read a built-in passage in Flash mode, where going back is impossible, then say what it was about.', 'pacer', null,
  'What is regression in reading?', 'Unnecessarily jumping back to reread words or lines.');

L('r4', 'reading', 'Widen your eye span', ['llg', 'sr-comp', 'kk'],
  'Eyes read in jumps and stops, and only the stops take in text. Fewer, wider stops per line means more words per second. Learn Like a Genius uses Schulte tables for this; other courses call the result chunking.',
  ['Do a Schulte table daily: eyes fixed on the centre, find the numbers in order with peripheral vision.', 'When reading, aim your eyes at the middle of word groups, not at each word.', 'Skip the margins: start each line a word or two in and stop a word or two before the end.', 'Work up from two words per stop to three and four.'],
  null, 'Do three 5×5 Schulte tables, then Eye Span with digits.', 'schulte', null,
  'Where do you look during a Schulte table?', 'At the centre square, finding the numbers with peripheral vision.');

L('r5', 'reading', 'Quiet the inner voice', ['llg', 'kwik-sr', 'kk'],
  'Subvocalising, saying each word silently, ties reading to speaking speed. You do not need to pronounce a word to understand it: you do not say "stop" at a stop sign. The aim is to reduce it, not remove it.',
  ['Read in word groups so there is no time to say each word.', 'Push the pacer faster than you can speak.', 'Occupy the voice: count "one, two, three" quietly or hum while reading practice text.', 'Keep the inner voice for what deserves it: poetry, key definitions, hard passages.'],
  null, 'Use Flash mode at 3 words per group and a speed where you cannot pronounce the words. Start around 350 wpm.', 'pacer', null,
  'Why does subvocalising limit speed?', 'It holds reading down to roughly the pace of speech.');

L('r6', 'reading', 'Preview before you read', ['llg', 'sr-comp', 'sr-deep'],
  'A few minutes of pre-reading gives the brain a frame to hang details on, and often shows that parts can be skipped. It is step one of the three-step method in Learn Like a Genius.',
  ['Read the title, introduction, headings, first sentences of paragraphs, anything in bold, figures and the conclusion.', 'Ask what the piece is about and what you want from it.', 'Skimming is a fast pass for the gist. Scanning is hunting for one specific item. Choose which you need.', 'Then read properly, already knowing the shape.'],
  null, 'Preview a long article for two minutes. Write the three questions you expect it to answer, then read it.', null, null,
  'What is the difference between skimming and scanning?', 'Skimming is a fast pass for the overall gist; scanning is searching for a specific piece of information.');

L('r7', 'reading', 'Change gears', ['sr-deep', 'sr-comp', 'kk'],
  'Good readers do not have one speed. They slow down for dense, important or unfamiliar material and move quickly through what is light or already known.',
  ['Before reading, decide your purpose: overview, full understanding, or finding something.', 'Judge the density of the text. Light text: fast. Heavy text: slower, with pauses.', 'Speed up through examples and repetition; slow down at definitions and arguments.', 'For unfamiliar subjects, read the first lines of paragraphs and the opening and closing sections first.'],
  null, 'Read one article at three deliberate speeds: fast through the easy parts, normal, and slow at the key argument.', 'pacer', null,
  'What decides how fast you should read a text?', 'Your purpose and the density and familiarity of the material.');

L('r8', 'reading', 'Let comprehension catch up', ['llg', 'kwik-sr'],
  'When you first push speed, understanding drops. That is expected. With practice at the higher pace, comprehension catches up, and your old speed begins to feel slow.',
  ['In practice sessions, deliberately read faster than you can fully follow for a few minutes.', 'Drop back by about a third. This is your new working speed.', 'After every reading, recall: say or write the main points without looking.', 'Turn what matters into notes or cards. Reading fast and remembering nothing saves no time.'],
  null, 'Take the Reading Speed Test again, pushing your pace. Check whether effective wpm rose or fell.', 'wpm', null,
  'What should you do right after reading something you want to keep?', 'Recall the main points from memory, then note or card the important ones.');

L('r9', 'reading', 'Flash reading and timed drills', ['sr-comp', 'kk'],
  'Rapid serial visual presentation shows words one group at a time in a fixed spot, so the eyes do not move at all. It is a training tool for pace and for breaking the inner voice, and timed drills keep the practice honest.',
  ['Start at a comfortable speed with two or three words per group.', 'Raise the speed by 25 wpm every minute until you lose the thread.', 'Step back 50 wpm and read for five minutes.', 'Finish by summarising aloud.', 'Use real page reading for study; flash reading removes the ability to glance back, so it suits practice more than hard texts.'],
  null, 'Do a five-minute climb in Flash mode on your own pasted text.', 'pacer', null,
  'What does RSVP stand for and what does it remove?', 'Rapid serial visual presentation; it removes eye movement and back-skipping.');

L('r10', 'reading', 'A daily reading workout', ['kwik-sr', 'llg', 'kk'],
  'Speed reading is trained like a sport: short, regular, slightly beyond comfort. Fifteen minutes a day for a few weeks changes your default.',
  ['Two minutes: Schulte table or Eye Span to warm up the eyes.', 'Four minutes: read with a pacer, comfortably.', 'Then reread the same passage in less time, and again in less still, forcing the pacer faster each round even if comprehension dips.', 'Two minutes: fresh text at a pace you can follow. Notice it is faster than before.', 'One minute: recall what you read.', 'Retest your effective wpm weekly.'],
  null, 'Do the full workout once today using the Pacer and your own book.', 'pacer', null,
  'What is the purpose of rereading the same passage against a shrinking clock?', 'It forces the eyes to move faster than comfortable, so normal reading afterwards feels slow and speeds up.');

/* ============ MENTAL MATH ============ */
L('x1', 'math', 'Add from left to right', ['benj', 'mmm', 'vedic'],
  'On paper we add right to left and carry. In the head that means holding digits you cannot yet say. Arthur Benjamin\'s first rule in Secrets of Mental Math is to work left to right, biggest part first, keeping one running total.',
  ['Keep the first number whole. Break the second into hundreds, tens and ones.', 'Add the largest part first and say the new total to yourself.', 'Add the next part, then the last.', 'You start saying the answer before you finish, and a rough answer comes first.'],
  '538 + 327 → 538 + 300 = 838 → + 20 = 858 → + 7 = <b>865</b>.',
  'Sprint 2-digit additions, then 3-digit.', 'math', { cat: 'add2' },
  'Why add left to right in your head?', 'You deal with the largest part first and keep a single running total, with nothing to carry and hold.');

L('x2', 'math', 'Subtract with complements', ['benj', 'mmm', 'vedic'],
  'Borrowing is awkward mentally. It is easier to subtract too much and give some back, and for that you need instant complements.',
  ['Round the number you are subtracting up to the next ten or hundred.', 'Subtract the round number.', 'Add back the difference (the complement).', 'Complements to 100: the tens digits add to 9, the ones add to 10. Vedic maths says "all from 9 and the last from 10".'],
  '725 − 468 → 725 − 500 = 225 → + 32 = <b>257</b>. And 1000 − 468: 9−4, 9−6, 10−8 → <b>532</b>.',
  'Sprint Complements until they are instant, then 2-digit subtraction.', 'math', { cat: 'comp' },
  'What is the rule for a complement to 1000?', 'Take every digit from 9 and the last digit from 10.');

L('x3', 'math', 'Multiply by one digit, left to right', ['benj', 'hcm'],
  'All larger multiplication is built from this. Again, biggest part first.',
  ['Split the larger number into tens and ones.', 'Multiply the tens, say the result.', 'Multiply the ones and add.', 'For three digits, the same: hundreds, then tens, then ones, updating the total each time.'],
  '7 × 46 → 280 + 42 = <b>322</b>. 6 × 384 → 1800 → + 480 = 2280 → + 24 = <b>2304</b>.',
  'Sprint 2-digit × 1-digit.', 'math', { cat: 'x1' },
  'What is 8 × 67, worked left to right?', '480 + 56 = 536.');

L('x4', 'math', 'Multiply by 11', ['benj', 'mmm', 'tables'],
  'The first trick most mental-math courses teach, because it is instant and shows that structure beats effort.',
  ['For a two-digit number, add its digits.', 'Put the sum between them.', 'If the sum is 10 or more, carry 1 to the left digit.', 'Longer numbers: write the last digit, then each pair of neighbours added right to left, then the first digit, carrying as needed.'],
  '53 × 11 → 5 (8) 3 = <b>583</b>. 87 × 11 → 8 (15) 7 → <b>957</b>.',
  'Sprint ×11.', 'math', { cat: 'x11' },
  'What is 76 × 11?', '7 (13) 6 → 836.');

L('x5', 'math', 'Squares ending in 5, and close cousins', ['benj', 'mmm', 'easycal', 'vedic'],
  'A two-step shortcut, and the same pattern handles any two numbers with the same tens digit whose ones digits add to ten.',
  ['Squaring a number ending in 5: multiply the tens digit by the next number up.', 'Attach 25.', 'Same tens, ones adding to 10: multiply the tens digit by the next number up, then attach the product of the ones (two digits).'],
  '65² → 6 × 7 = 42 → <b>4225</b>. 73 × 77 → 7 × 8 = 56, 3 × 7 = 21 → <b>5621</b>.',
  'Sprint Squares ending in 5, then Same tens.', 'math', { cat: 'sq5' },
  'What is 85²?', '8 × 9 = 72, attach 25 → 7225.');

L('x6', 'math', 'Square any two-digit number', ['benj', 'mmm'],
  'Benjamin\'s signature method. It turns a hard multiplication into an easy one plus a tiny square.',
  ['Find the distance d to the nearest multiple of ten.', 'Go down by d and up by d to get two numbers, one of them round.', 'Multiply those two.', 'Add d².'],
  '43² → d = 3 → 40 × 46 = 1840 → + 9 = <b>1849</b>. 78² → d = 2 → 80 × 76 = 6080 → + 4 = <b>6084</b>.',
  'Sprint Square any 2-digit number.', 'math', { cat: 'sq2' },
  'What is 57² by this method?', '60 × 54 = 3240, + 3² = 3249.');

L('x7', 'math', 'Multiply numbers close to 100', ['vedic', 'easycal', 'smart', 'benj'],
  'The Vedic base method: when both numbers are near a base such as 100, the answer falls out of their distances from it.',
