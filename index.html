  ['Write each number\'s distance from 100 (below = negative, above = positive).', 'Left part: cross-add. Take either number plus the other\'s distance.', 'Right part: multiply the two distances, written as two digits.', 'If one number is above and one below, the right part is negative: subtract it from the left part × 100.'],
  '96 × 93: distances −4, −7. 96 − 7 = 89; 4 × 7 = 28 → <b>8928</b>. 104 × 107: 111 | 28 → <b>11128</b>. 103 × 96: 99 | −12 → 9900 − 12 = <b>9888</b>.',
  'Sprint Numbers near 100.', 'math', { cat: 'near100' },
  'What is 97 × 94?', 'Distances 3 and 6: 97 − 6 = 91, 3 × 6 = 18 → 9118.');

L('x8', 'math', 'Two digits by two digits', ['benj', 'vedic', 'smart', 'mmm'],
  'There are several routes; choose the one that makes the numbers easy. Benjamin teaches three, and the Vedic courses add vertical-and-crosswise.',
  ['<b>Addition method:</b> split one number. 23 × 41 = 23 × 40 + 23.', '<b>Subtraction method:</b> when a number ends in 8 or 9. 29 × 34 = 30 × 34 − 34.', '<b>Factoring:</b> when a number factors nicely. 45 × 14 = 45 × 2 × 7.', '<b>Vertical and crosswise:</b> tens × tens, the two cross products added, ones × ones; combine with place value.'],
  '23 × 41 → 920 + 23 = <b>943</b>. 29 × 34 → 1020 − 34 = <b>986</b>. Crosswise 23 × 41: 2×4 = 8 | 2×1 + 3×4 = 14 | 3×1 = 3 → 800 + 140 + 3 = 943.',
  'Sprint 2-digit × 2-digit. Before each one, pick the method.', 'math', { cat: 'x2' },
  'Which method suits 49 × 26?', 'Subtraction: 50 × 26 − 26 = 1300 − 26 = 1274.');

L('x9', 'math', 'Tables beyond 10, doubling and halving', ['tables', 'smart', 'easycal', 'hcm'],
  'Knowing products up to 20 × 20 by reflex, and being able to double and halve anything, makes every other method faster.',
  ['Two numbers in the teens: add the ones digit of one to the other number, attach a zero, add the product of the ones digits.', 'Doubling: left to right. 2 × 78 = 140 + 16.', 'Multiply by 4 = double twice; by 8 = double three times.', 'Multiply by 5 = halve and attach a zero; divide by 5 = double and move the decimal.', 'Halve one, double the other: 14 × 35 = 7 × 70.'],
  '14 × 17 → 17 + 4 = 21 → 210 → + 28 = <b>238</b>. 5 × 468 → 234 → <b>2340</b>.',
  'Sprint Tables up to 20 × 20, then Double and halve.', 'math', { cat: 'tables' },

  if (f.hair === 4) s += `<circle cx="50" cy="8" r="9" fill="${hair}"/>`;

  if (f.hair === 1 || f.hair === 2 || f.hair === 4) s += `<path d="M${50 - rx} 44 Q${50 - rx} 10 50 12 Q${50 + rx} 10 ${50 + rx} 44 Q${50 + rx - 10} 24 50 26 Q${50 - rx + 10} 24 ${50 - rx} 44 Z" fill="${hair}"/>`;
  if (f.hair === 3) for (let i = 0; i < 9; i++) s += `<circle cx="${50 - rx + 2 + i * (rx * 2 - 4) / 8}" cy="${22 - Math.sin(i / 8 * Math.PI) * 10}" r="9" fill="${hair}"/>`;

  s += `<path d="M50 52 q${f.nose ? -6 : -3} ${f.nose ? 12 : 8} 0 ${f.nose ? 13 : 9}" stroke="#00000055" stroke-width="1.6" fill="none"/>`;
  s += [`<path d="M40 72 q10 8 20 0" stroke="#7a2b2b" stroke-width="2.2" fill="none"/>`, `<path d="M42 73 h16" stroke="#7a2b2b" stroke-width="2.2"/>`, `<path d="M40 70 q10 12 20 0 Z" fill="#fff" stroke="#7a2b2b" stroke-width="1.6"/>`][f.mouth];
  if (f.beard === 1) s += `<path d="M${50 - rx + 3} 62 Q50 ${54 + ry + 12} ${50 + rx - 3} 62 Q${50 + rx - 8} ${54 + ry - 4} 50 ${54 + ry - 2} Q${50 - rx + 8} ${54 + ry - 4} ${50 - rx + 3} 62 Z" fill="${hair}" opacity=".9"/>`;
  if (f.beard === 2) s += `<path d="M38 67 q12 -6 24 0 q-12 3 -24 0 Z" fill="${hair}"/>`;

  if (f.ear) s += `<circle cx="${50 - rx - 1}" cy="65" r="2.6" fill="#E0B100"/><circle cx="${50 + rx + 1}" cy="65" r="2.6" fill="#E0B100"/>`;

      el('div', { class: 'row' }, el('button', { class: 'btn primary', onclick: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' })); a.download = 'mind-mastery-backup-' + today() + '.json'; document.body.append(a); a.click(); a.remove(); fmsg.textContent = 'Backup file downloaded.'; } }, 'Download backup file')),
      el('label', { for: 'bk-file' }, 'Import backup file', fi), fmsg));
  }
  let armed = false; const rb = el('button', { class: 'btn', onclick: () => { if (!armed) { armed = true; rb.textContent = 'Tap again to erase everything'; return; } S = defState(); save(); applyTheme(); tab('today'); } }, 'Reset all progress');
  w.append(el('div', { class: 'card' }, el('h3', null, 'Start over'), el('p', { class: 'muted small' }, 'Erases lessons done, scores, cards, routes and notes on this device.'), el('div', { class: 'row' }, rb)));
}

/* ---------- boot ---------- */
function boot() {
  applyTheme();
  const nav = $('nav.tabs'); TABS.forEach(([id, name, icon]) => nav.append(el('button', { 'data-tab': id, onclick: () => tab(id), html: `<svg viewBox="0 0 24 24" aria-hidden="true">${icon}</svg><span>${name}</span>` })));
  $('#back').addEventListener('click', back);
  const fromHash = () => { const h = (location.hash || '').replace('#', ''); return VIEWS[h] ? h : 'today'; };
  window.addEventListener('hashchange', () => { const h = fromHash(); if (h !== curTab || stack.length > 1) tab(h, true); });
  tab(fromHash(), true);
}

boot();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
